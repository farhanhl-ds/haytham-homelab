---
# Configure Proxmox host-side LXC device passthrough (/dev/net/tun for Zone 3 Tailscale
# CT 132, /dev/dri/* for Zone 2 Immich CT 121). Run right after Terraform apply and
# before zone playbooks.
- name: Configure Proxmox LXC device passthrough
  hosts: proxmox
  become: true
  roles:
    - pve_devices
