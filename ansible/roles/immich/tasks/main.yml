---
- name: Check whether /dev/dri/renderD128 is passed through for Intel Quick Sync
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: dri_device

- name: Warn if /dev/dri/renderD128 is missing
  ansible.builtin.debug:
    msg: >-
      /dev/dri/renderD128 not detected in CT 121. Run `ops-ansible-apply host_devices.yml`
      before enabling VAAPI / Intel Quick Sync hardware transcoding in Immich Admin UI.
  when: not dri_device.stat.exists

- name: Guard against unset CHANGEME database password
  ansible.builtin.fail:
    msg: "vault_immich_db_password is still CHANGEME. Populate it in Zone 1 Infisical (/zone2) and run via ops-ansible-apply."
  when: immich_db_password == "CHANGEME"

- name: Create Immich directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ immich_data_dir }}"
    - "{{ immich_upload_location }}"
    - "{{ immich_db_data_location }}"

- name: Deploy Immich .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_data_dir }}/.env"
    mode: "0600"
  no_log: true
  notify: restart immich

- name: Deploy Immich docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart immich

- name: Bring Immich stack up
  community.docker.docker_compose_v2:
    project_src: "{{ immich_data_dir }}"
    state: present
