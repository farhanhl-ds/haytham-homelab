---
# Immich defaults — Tier 60 Media (CTID 610, 500 GB thin-provisioned on local-lvm).
# Self-contained 4-container bundle (server + ML + Valkey + Postgres/VectorChord).
# Do NOT wire to shared Tier 20 Postgres/Redis. kb/services/media-immich-610.md
immich_data_dir: /opt/immich
immich_upload_location: "{{ immich_data_dir }}/library"
immich_db_data_location: "{{ immich_data_dir }}/postgres"
immich_version: v3.4.2
immich_timezone: Asia/Jakarta
immich_port: 2283
immich_db_username: postgres
immich_db_name: immich
immich_db_password: "{{ vault_immich_db_password }}"
immich_valkey_image: docker.io/valkey/valkey:9
immich_postgres_image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
# Tuned for 8 GB RAM / 4-core i5 7th gen host:
immich_ml_workers: 1
immich_ml_request_threads: 2
