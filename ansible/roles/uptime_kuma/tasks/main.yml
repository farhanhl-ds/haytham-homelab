---
- name: Create Uptime Kuma data directory
  ansible.builtin.file:
    path: "{{ uptime_kuma_data_dir }}/data"
    state: directory
    mode: "0755"

- name: Deploy Uptime Kuma compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uptime_kuma_data_dir }}/docker-compose.yml"
    mode: "0644"
  notify: restart uptime_kuma

- name: Bring Uptime Kuma up
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_data_dir }}"
    state: present
