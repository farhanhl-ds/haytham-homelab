---
# Zone 0 Proxmox host (`haytham` @ 192.168.100.2) — LXC device passthrough + automated backups.
# Secret `vault_restic_password` is injected at runtime from Zone 1 Infisical path `/proxmox`
# by ops-ansible-{check,apply}. Never commit real secrets here.
backup_base_dir: /var/backups/homelab
backup_restic_repo: "{{ backup_base_dir }}/restic"
backup_staging_dir: "{{ backup_base_dir }}/staging"
backup_keep_daily: 7
backup_keep_weekly: 4
backup_schedule_oncalendar: "*-*-* 03:00:00"
backup_vzdump_schedule_oncalendar: "Sun *-*-* 03:30:00"
backup_vzdump_storage: local
backup_vzdump_keep_last: 2
backup_vzdump_ctids:
  - 110 # Zone 1 Immutable Infisical
  - 120 # Zone 2 Vaultwarden
  - 130 # Zone 3 Pi-hole
  - 131 # Zone 3 NPM
  - 132 # Zone 3 Tailscale
  - 140 # Zone 4 Homepage
  - 141 # Zone 4 Uptime Kuma

# Runtime secret injected from Zone 1 Infisical (/proxmox):
vault_restic_password: CHANGEME
