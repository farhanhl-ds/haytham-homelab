# Haytham Homelab — Ansible configuration
# Canonical docs: kb/architecture/ansible-strategy.md & kb/decisions/ADR-008-zero-trust-security-zones-and-infisical.md

[defaults]
remote_user = root
# Secrets are injected at runtime into RAM (/dev/shm) from Zone 1 Infisical (CT 110)
# by /usr/local/libexec/haytham-ops/ops-ansible-{check,apply}. Never store .vault_pass in Git.
inventory = inventory/hosts.yml
collections_path = ./collections:/usr/share/ansible/collections:~/.ansible/collections
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
